<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tower Defense">
<meta name="description" content="Tower Defense: Last Stand — защита базы от 50 волн на 50 уровнях">
<title>Tower Defense: Last Stand</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game-canvas" aria-hidden="true"></canvas>

<div id="game-hud" aria-hidden="true">
  <header id="hud-top">
    <div class="hud-stat"><span class="icon">💰</span><span class="value" id="money-val">200</span></div>
    <div class="hud-stat"><span class="icon">❤</span><span class="value" id="lives-val">20</span></div>
    <div class="hud-stat"><span class="value" id="wave-val">0/10</span></div>
    <div class="hud-stat"><span class="icon">★</span><span class="value" id="score-val">0</span></div>
    <div class="hud-spacer"></div>
    <button class="hud-btn" id="btn-speed" aria-label="Скорость">1x</button>
    <button class="hud-btn" id="btn-fullscreen-game" aria-label="Полный экран">⛶</button>
    <button class="hud-btn" id="btn-pause" aria-label="Пауза">II</button>
    <button class="hud-btn" id="btn-exit" aria-label="Выход">✕</button>
  </header>

  <aside id="tower-panel" aria-label="Панель башен">
    <div class="panel-header">БАШНИ</div>
    <div class="tower-list" id="tower-list"></div>
  </aside>

  <footer id="hud-bottom">
    <button id="btn-start-wave" class="primary">НАЧАТЬ ВОЛНУ</button>
    <div class="bottom-info" id="wave-info">Волна 1 / 10</div>
    <button id="btn-restart" aria-label="Начать заново">ЗАНОВО</button>
  </footer>

  <div id="tower-info-panel" class="hidden" role="dialog" aria-label="Информация о башне">
    <div class="ti-header">
      <div class="ti-name" id="ti-name">—</div>
      <div class="ti-level" id="ti-level">Ур.1</div>
    </div>
    <div class="ti-stats" id="ti-stats"></div>
    <div class="ti-actions">
      <button id="btn-upgrade" class="action-btn upgrade">УЛУЧШИТЬ</button>
      <button id="btn-sell" class="action-btn sell">ПРОДАТЬ</button>
      <button id="btn-close-ti" class="action-btn close" aria-label="Закрыть">✕</button>
    </div>
  </div>
</div>

<div id="toast-wrap" aria-live="polite"></div>

<main id="menu-screen" class="screen">
  <div class="menu-box">
    <h1>TOWER DEFENSE</h1>
    <h2>LAST STAND</h2>
    <div class="progress-bar">
      <div class="pb-item"><div class="pb-val" id="menu-stars">0/150</div><div class="pb-lbl">ЗВЁЗДЫ</div></div>
      <div class="pb-item"><div class="pb-val" id="menu-score">0</div><div class="pb-lbl">ОЧКИ</div></div>
      <div class="pb-item"><div class="pb-val" id="menu-unlocked">5/50</div><div class="pb-lbl">УРОВНИ</div></div>
    </div>
    <button id="btn-play" class="menu-btn">ИГРАТЬ</button>
    <button id="btn-fullscreen-menu" class="menu-btn secondary">НА ВЕСЬ ЭКРАН</button>
    <div class="menu-row">
      <button id="btn-export" class="menu-btn secondary tiny">СОХР В ФАЙЛ</button>
      <button id="btn-import" class="menu-btn secondary tiny">ЗАГР ИЗ ФАЙЛА</button>
    </div>
    <button id="btn-reset" class="menu-btn danger">СБРОСИТЬ ПРОГРЕСС</button>
    <input type="file" id="import-input" accept=".json,application/json" hidden>
  </div>
</main>

<main id="levels-screen" class="screen hidden">
  <div class="screen-header">
    <button id="btn-back" class="back-btn">← МЕНЮ</button>
    <h2>ВЫБОР УРОВНЯ</h2>
    <div class="header-stats">
      <span id="hdr-stars">0/150</span>
      <span id="hdr-score">0</span>
    </div>
  </div>
  <div class="levels-grid" id="levels-grid"></div>
</main>

<main id="loadout-screen" class="screen hidden">
  <div class="screen-header">
    <button id="btn-loadout-back" class="back-btn">← УРОВНИ</button>
    <h2 id="loadout-title">ПОДГОТОВКА</h2>
    <div class="header-stats"><span id="loadout-diff">НОРМА</span></div>
  </div>
  <div class="loadout-wrap">
    <section class="loadout-block">
      <div class="loadout-block-title">СЛОЖНОСТЬ</div>
      <div class="diff-row">
        <button class="diff-btn easy" data-diff="easy"><div class="dn">ЛЕГКО</div><div class="dd">Меньше врагов, +5 жизней</div></button>
        <button class="diff-btn normal selected" data-diff="normal"><div class="dn">НОРМА</div><div class="dd">Стандартный баланс</div></button>
        <button class="diff-btn hard" data-diff="hard"><div class="dn">СЛОЖНО</div><div class="dd">Больше врагов, −5 жизней</div></button>
      </div>
    </section>
    <section class="loadout-block">
      <div class="loadout-block-title">ВЫБОР БАШЕН <span id="pick-counter">4/4</span></div>
      <div class="tower-select-grid" id="tower-select-grid"></div>
    </section>
    <div class="loadout-actions">
      <button id="btn-loadout-start" class="menu-btn">В БОЙ</button>
    </div>
  </div>
</main>

<main id="end-screen" class="screen hidden">
  <div class="menu-box">
    <h1 id="end-title">ПОБЕДА</h1>
    <div class="end-stars" id="end-stars"></div>
    <p id="end-sub">—</p>
    <div class="end-stats" id="end-stats"></div>
    <button id="btn-end-next" class="menu-btn" hidden>СЛЕДУЮЩИЙ УРОВЕНЬ</button>
    <button id="btn-end-retry" class="menu-btn secondary">ПРОЙТИ СНОВА</button>
    <button id="btn-end-menu" class="menu-btn secondary">В МЕНЮ</button>
  </div>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
